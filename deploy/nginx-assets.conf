# Include inside the server block of /etc/nginx/sites-available/3d-real-estate (phase 7).
types {
    model/gltf-binary glb;
}

location /models/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
